<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- 한지 ground — flat, no gradient anywhere -->
  <rect width="1200" height="630" fill="#FAF7F0"/>

  <!-- thin double hairline frame, inset 24px -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#D3C7AE" stroke-width="1.5"/>
  <rect x="34" y="34" width="1132" height="562" fill="none" stroke="#E5DDCC" stroke-width="1"/>

  <!-- 낙관 seal, left of center -->
  <g transform="translate(310,315)">
    <rect x="-115" y="-115" width="230" height="230" rx="8" fill="#C0472B"/>
    <rect x="-97" y="-97" width="194" height="194" rx="4" fill="none" stroke="#F1EBDD" stroke-width="5"/>
    <path d="M-25.9 -66.1V66.1M25.9 -66.1V66.1M-66.1 -25.9H66.1M-66.1 25.9H66.1"
          fill="none" stroke="#F1EBDD" stroke-width="14"/>
  </g>

  <!-- Latin wordmark only: librsvg resolves <text> against system fonts, so Korean
       here would silently break in CI. Serif falls back to Liberation/DejaVu Serif. -->
  <text x="500" y="310" font-family="Georgia,'Times New Roman',Times,serif"
        font-size="96" font-weight="700" letter-spacing="24" fill="#1C1A16">ONJAE</text>
  <rect x="506" y="338" width="132" height="2" fill="#C0472B"/>
  <text x="504" y="386" font-family="Georgia,'Times New Roman',Times,serif"
        font-size="23" font-weight="400" letter-spacing="8" fill="#857C6C">KOREAN MEDICINE CLINIC DATA</text>
</svg>
